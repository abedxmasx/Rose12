name: Build Rose12 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Rose12 project
        run: |
          mkdir rose12
          unzip -q Rose12_V4_7_Mobile_Build.zip -d rose12

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Create Android platform
        working-directory: rose12
        run: flutter create . --platforms=android

      - name: Get dependencies
        working-directory: rose12
        run: flutter pub get

      - name: Build APK
        working-directory: rose12
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rose12-APK
          path: rose12/build/app/outputs/flutter-apk/app-release.apk
